# Anh xa Story -> Permission Key(s)
# Nguon su that duy nhat cho: "story nao kiem tra quyen nao"
# Ngay tao: 2026-10-21
#
# Quy tac:
#  - Moi story chi duoc anh xa sang WRITE/ACTION permission key ma no truc tiep cap quyen
#  - Neu mot key duoc anh xa tu nhieu story, cac o "cung role" KHONG DUOC MAU THUAN
#    (neu mau thuan: script bao loi va dung - xem pha3_gap_v3.py)
#  - "Xem" thuan tuy khong nen chia se key voi hanh dong ghi
#  - Neu chua co endpoint: ghi endpoint_status: not_implemented

