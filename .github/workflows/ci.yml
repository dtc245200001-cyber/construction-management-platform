name: CI

on:
  push:
    branches:
      - main
      - test-ci-t02
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # T-08: __tests__/workItemTree.test.js chạy truy vấn đệ quy trên Postgres thật,
    # nên CI cần một service Postgres thật thay vì mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: construction_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres123@localhost:5432/construction_db_test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: construction_db_test
      DB_USER: postgres
      DB_PASSWORD: postgres123

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migrate up

      - name: Test
        run: npm run test

  # Job frontend đang TẮT vì thư mục frontend/ chưa có mã nguồn (mới có .gitkeep).
  # Bật lại job này ngay khi task scaffold frontend (ví dụ T-06) hoàn thành,
  # để không chặn nhầm các PR chỉ sửa backend.
  #
  # frontend:
  #   name: Frontend CI (Node.js)
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: ./frontend
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #     - name: Setup Node.js 20
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #     - name: Install dependencies
  #       run: npm ci
  #     - name: Lint
  #       run: npm run lint
  #     - name: Build
  #       run: npm run build
  #     - name: Test
  #       run: npm run test

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        run: echo "REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}-backend:latest
            ghcr.io/${{ env.REPO }}-backend:${{ github.sha }}

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd ~/construction-management-platform || exit 1
            bash deploy/deploy.sh ghcr.io/${{ env.REPO }}-backend:${{ github.sha }}
