name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
          # Caching NuGet packages (requires a lock file or relies on default global packages caching)
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Check code formatting (Lint)
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend CI (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

# huong dan : 
# 1. Mở terminal và di chuyển đến thư mục gốc của dự án (nơi có file .github).
# 2. Tạo branch mới: git checkout -b test-ci-t04
# 3. Thêm file này vào git: git add .
# 4. Commit: git commit -m "Fix: Add CI workflow"
# 5. Push lên GitHub: git push origin test-ci-t04