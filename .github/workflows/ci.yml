name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI (Node.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  # Job frontend đang TẮT vì thư mục frontend/ chưa có mã nguồn (mới có .gitkeep).
  # Bật lại job này ngay khi task scaffold frontend (ví dụ T-06) hoàn thành,
  # để không chặn nhầm các PR chỉ sửa backend.
