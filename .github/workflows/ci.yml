name: CI

on:
  push:
    branches:
      - main
      - test-ci-t02
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI (Node.js)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: construction_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres123@localhost:5433/construction_db_test

    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  # Job frontend đang TẮT vì thư mục frontend/ chưa có mã nguồn (mới có .gitkeep).
  # Bật lại job này ngay khi task scaffold frontend (ví dụ T-06) hoàn thành,
  # để không chặn nhầm các PR chỉ sửa backend.
  #
  # frontend:
  #   name: Frontend CI (Node.js)
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: ./frontend
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #     - name: Setup Node.js 20
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #     - name: Install dependencies
  #       run: npm ci
  #     - name: Lint
  #       run: npm run lint
  #     - name: Build
  #       run: npm run build
  #     - name: Test
  #       run: npm run test

  # =========================================================================
  # T-03: Build Docker image và push lên GitHub Container Registry (ghcr.io)
  # Chỉ chạy khi push vào main VÀ job backend (lint/build/test) đã pass.
  # =========================================================================
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}-backend:latest

  # =========================================================================
  # T-03: Deploy lên staging server qua SSH
  # Dùng deploy.sh (blue/green rollback) đã có sẵn trong deploy/
  # Cần cấu hình GitHub Secrets: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY,
  # STAGING_DEPLOY_PATH
  # =========================================================================
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check staging secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.STAGING_HOST }}" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ STAGING_HOST chưa được cấu hình."
            echo "➡️ Để bật auto-deploy, vào repo Settings → Secrets → Actions và thêm:"
            echo "   - STAGING_HOST (IP server staging)"
            echo "   - STAGING_USER (SSH username)"
            echo "   - STAGING_SSH_KEY (SSH private key)"
            echo "   - STAGING_DEPLOY_PATH (đường dẫn thư mục deploy trên server)"
            echo ""
            echo "📦 Image đã được push thành công lên ghcr.io — sẵn sàng deploy khi có server."
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Staging secrets đã cấu hình. Bắt đầu deploy..."
          fi

      - name: Deploy via SSH
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_DEPLOY_PATH }}

            # Login vào ghcr.io để pull image private (nếu repo private)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Chạy deploy.sh blue/green với image mới (tag = commit SHA)
            # Script sẽ: pull image → start container mới → healthcheck →
            # nếu OK: xóa cũ, rename mới; nếu FAIL: rollback, giữ bản cũ
            chmod +x deploy.sh
            ./deploy.sh "ghcr.io/${{ github.repository }}-backend:${{ github.sha }}"

