# render.yaml - Render Blueprint
services:
  # ─── BACKEND API ───────────────────────────────────────────────────────────
  - type: web
    name: construction-api
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: construction-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # Origin thật của frontend trên Render. Rewrite /api/* ở service
        # frontend có forward header Origin xuống backend, nên khai báo đúng ở đây.
        value: https://construction-management-platform-1.onrender.com
      - key: COOKIE_SAMESITE
        # Frontend gọi API qua rewrite /api/* cùng origin (xem service frontend
        # bên dưới), nên cookie là first-party; Safari/Chrome iOS (ITP) giữ được
        # cookie với SameSite=Lax. SameSite=None sẽ bị ITP chặn nếu quay lại cross-site.
        value: lax
      - key: COOKIE_SECURE
        # SameSite=None chỉ có tác dụng khi cookie Secure (HTTPS).
        value: true
      - key: UPLOAD_DIR
        value: ./uploads

  # ─── FRONTEND REACT ─────────────────────────────────────────────────────────
  - type: web
    name: construction-ui
    env: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        # Đường dẫn tương đối: trình duyệt gọi cùng origin với frontend,
        # Render proxy sang backend (rewrite bên dưới) -> cookie first-party.
        value: /api
    routes:
      # Phải đặt TRƯỚC rule /* để /api/* không bị rewrite về index.html
      - type: rewrite
        source: /api/*
        destination: https://construction-management-platform.onrender.com/api/*
      # Redirect all requests to index.html for React Router (SPA)
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ─── POSTGRESQL ─────────────────────────────────────────────────────────────
  - name: construction-db
    databaseName: construction
    user: admin
    plan: free
    region: singapore
